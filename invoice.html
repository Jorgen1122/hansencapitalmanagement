<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://gboebdgbebyoanlzrczn.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Invoice</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root { --ink: #1A2233; --navy: #071428; --gold: #D4AF37; --gold-ink: #8A6D1E; --muted: #5B6474; --dim: #8A93A3; --line: #E4E0D5; --soft: #F7F4EC; --ok: #2F7A55; --bad: #B4472B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #EEF0F3; color: var(--ink); font: 15px/1.5 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 820px; margin: 32px auto; padding: 0 16px; }
  .sheet { background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(7,20,40,.06), 0 8px 28px rgba(7,20,40,.08); padding: 40px 44px; }
  .top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; padding-bottom: 20px; border-bottom: 2px solid var(--navy); }
  .biz { margin: 0; font: 600 26px/1.2 Georgia, 'Times New Roman', serif; color: var(--navy); }
  .sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .doc { text-align: right; }
  .doc h1 { margin: 0; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
  .num { margin: 2px 0 8px; font: 600 22px/1.2 Georgia, serif; color: var(--navy); }
  dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; font-size: 14px; justify-content: end; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; }
  .due-box { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin: 24px 0; padding: 18px 20px; background: var(--soft); border-left: 4px solid var(--gold); border-radius: 8px; }
  .due-box .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .due-box .amt { font: 700 30px/1.1 'Helvetica Neue', Arial, sans-serif; color: var(--navy); }
  .due-box.paid { border-left-color: var(--ok); } .due-box.paid .amt { color: var(--ok); }
  .to h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 4px; }
  .to p { margin: 0 0 20px; white-space: pre-line; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--navy); font-weight: 600; }
  td { padding: 10px 6px; border-bottom: 1px solid #ECEAE3; vertical-align: top; }
  .r { text-align: right; white-space: nowrap; }
  .sd { color: var(--dim); font-size: 13px; }
  .tot { margin-left: auto; width: 50%; min-width: 260px; margin-top: 12px; }
  .tot td { border: 0; padding: 5px 6px; }
  .tot .strong td { font-weight: 700; color: var(--navy); border-top: 2px solid var(--navy); padding-top: 9px; font-size: 17px; }
  .msg { margin-top: 24px; padding: 14px 16px; background: var(--soft); border-radius: 8px; white-space: pre-line; }
  .foot { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); white-space: pre-line; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; border-radius: 999px; font: 600 15px 'Helvetica Neue', Arial, sans-serif; cursor: pointer; border: 1px solid var(--navy); background: #fff; color: var(--navy); text-decoration: none; }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .stamp { display: inline-block; padding: 3px 10px; border: 2px solid var(--ok); color: var(--ok); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; border-radius: 4px; }
  .thanks { margin: 0 0 18px; padding: 12px 14px; border-radius: 8px; background: #EAF5EF; color: #1F5A3E; font-weight: 600; }
  .center { text-align: center; padding: 60px 20px; color: var(--muted); }
  .powered { text-align: center; color: var(--dim); font-size: 12px; margin: 18px 0 40px; }
  @media (max-width: 640px) { .sheet { padding: 24px 18px; } .top { flex-direction: column; } .doc { text-align: left; } dl { justify-content: start; } dd { text-align: left; } .tot { width: 100%; } }
  @media print { body { background: #fff; } .wrap { margin: 0; max-width: none; } .sheet { box-shadow: none; padding: 0; } .actions, .powered, .no-print { display: none !important; } @page { size: letter; margin: .6in; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="sheet" id="sheet"><p class="center">Loading…</p></div>
  <p class="powered">Sent with Hansen Capital Management</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script src="invoice.js"></script>
</body>
</html>
