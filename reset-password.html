<div class="wrap">
<div class="box">
<h1>Set a New Password</h1>
<p class="hint" id="hint">Enter a new password for your account below.</p>
<form id="reset-form" novalidate>
<label for="password">New Password</label>
<input type="password" id="password" required minlength="12" autocomplete="new-password" aria-describedby="password-error pw-rules">
<span class="field-error" id="password-error"></span>
<ul class="pw-rules" id="pw-rules" aria-live="polite">
<li id="rule-len">At least 12 characters</li>
<li id="rule-upper">An uppercase letter</li>
<li id="rule-lower">A lowercase letter</li>
<li id="rule-num">A number</li>
</ul>
<label for="confirm">Confirm New Password</label>
<input type="password" id="confirm" required minlength="12" autocomplete="new-password" aria-describedby="confirm-error">
<span class="field-error" id="confirm-error"></span>
<div id="mfa-row" hidden>
<label for="mfa-code">Verification Code</label>
<input type="text" id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="mfa-code-error">
<span class="field-error" id="mfa-code-error"></span>
</div>
<button type="submit" class="btn" id="submit-btn">Update Password</button>
<div id="message" class="form-alert" role="alert" aria-live="polite"></div>
</form>
</div>
</div>
