body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #030D1D; color: #D4AF37; line-height: 1.8; text-align: center; }
a { color: #D4AF37; }

.branch-bar a { opacity: 0.75; }
.branch-bar a:hover { opacity: 1; }
header { background: #071428; padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; }
header img { height: 70px; }
nav a { margin-left: 2rem; font-weight: 500; }
.wrap { min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.box { background: #071428; border: 1px solid rgba(212, 175, 55, 0.4); padding: 44px; width: 100%; max-width: 400px; text-align: left; }
.box h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 500; text-align: center; margin-top: 0; }

input:focus { outline: 1px solid #D4AF37; }
.btn { width: 100%; margin-top: 22px; background: #D4AF37; color: #030D1D; font-weight: 600; padding: 12px; border: none; font-size: 1rem; cursor: pointer; }
.btn:hover { background: #E8C458; }

#message.error { color: #E77; }

<link rel="stylesheet" href="site.css">

<body>

<div class="branch-bar">
<a href="index.html">&larr; Hansen Capital Management</a>
</div>

<header>
<img src="logo.png" alt="Hansen Capital Management Logo">
<nav>
<a href="financial-services.html">Home</a>
<a href="login.html">Client Login</a>
</nav>
</header>

<div class="wrap">
<div class="box">
<h1>Set a New Password</h1>
<p class="hint" id="hint">Enter a new password for your account below.</p>
<form id="reset-form" novalidate>
<label for="password">New Password</label>
<input type="password" id="password" required minlength="12" autocomplete="new-password" aria-describedby="password-error pw-rules">
<span class="field-error" id="password-error"></span>
<ul class="pw-rules" id="pw-rules" aria-live="polite">
<li id="rule-len">At least 12 characters</li>
<li id="rule-upper">An uppercase letter</li>
<li id="rule-lower">A lowercase letter</li>
<li id="rule-num">A number</li>
</ul>
<label for="confirm">Confirm New Password</label>
<input type="password" id="confirm" required minlength="12" autocomplete="new-password" aria-describedby="confirm-error">
<span class="field-error" id="confirm-error"></span>
<button type="submit" class="btn" id="submit-btn">Update Password</button>
<div id="message" class="form-alert" role="alert" aria-live="polite"></div>
</form>
</div>
</div>

<footer>
<p>&copy; 2026 Hansen Capital Management LLC. All rights reserved.</p>
<p class="legal-links"><a href="privacy-policy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const PW_RULES = [
  ['len', (p) => p.length >= 12],
  ['upper', (p) => /[A-Z]/.test(p)],
  ['lower', (p) => /[a-z]/.test(p)],
  ['num', (p) => /\d/.test(p)],
];
const passwordOk = (p) => PW_RULES.every(([, test]) => test(p));
function updateRules(p) {
  PW_RULES.forEach(([key, test]) => { const li = $('rule-' + key); if (li) li.classList.toggle('ok', test(p)); });
}
function friendlyError(err) {
  const m = ((err && err.message) || '').toLowerCase();
  const status = err && err.status;
  if (status === 429 || m.includes('rate limit') || m.includes('too many'))
    return 'Too many attempts. Please wait a few minutes, then try again.';
  if (m.includes('invalid login credentials'))
    return 'That email and password don’t match our records. Check for typos, or use “Forgot password?” below.';
  if (m.includes('email not confirmed'))
    return 'Please confirm your email first — check your inbox for the confirmation link.';
  if (m.includes('already registered') || m.includes('already been registered'))
    return 'An account with that email already exists. Try logging in instead.';
  if (m.includes('should be different'))
    return 'Your new password must be different from your current one.';
  if (m.includes('password'))
    return 'That password doesn’t meet the requirements. Use at least 12 characters with uppercase and lowercase letters and a number.';
  if (m.includes('failed to fetch') || m.includes('network'))
    return 'We couldn’t reach the server. Check your internet connection and try again.';
  return 'Something went wrong. Please try again, or email general@hansencapitalmanagement.com.';
}
function setMessage(text, cls) {
  const el = $('message');
  el.textContent = text;
  el.className = 'form-alert' + (cls ? ' ' + cls : '');
}
function fieldError(id, msg) {
  const input = $(id), el = $(id + '-error');
  if (msg) { input.setAttribute('aria-invalid', 'true'); el.textContent = msg; }
  else { input.removeAttribute('aria-invalid'); el.textContent = ''; }
}
function setBusy(btn, busy, label) {
  btn.disabled = busy;
  btn.setAttribute('aria-busy', busy ? 'true' : 'false');
  btn.textContent = '';
  if (busy) { const sp = document.createElement('span'); sp.className = 'spinner'; sp.setAttribute('aria-hidden', 'true'); btn.appendChild(sp); }
  btn.appendChild(document.createTextNode(label));
}
const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

let recoveryReady = false;
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
});
supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) recoveryReady = true;
});

$('password').addEventListener('input', (e) => { updateRules(e.target.value); fieldError('password', ''); });
$('confirm').addEventListener('input', () => fieldError('confirm', ''));

$('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('password').value;
  const confirm = $('confirm').value;
  const btn = $('submit-btn');
  setMessage('', '');

  let bad = false;
  if (!passwordOk(password)) { fieldError('password', 'Your new password doesn’t meet all the requirements below.'); bad = true; }
  if (!confirm) { fieldError('confirm', 'Re-enter your new password.'); bad = true; }
  else if (password !== confirm) { fieldError('confirm', 'Passwords don’t match.'); bad = true; }
  if (bad) { document.querySelector('[aria-invalid="true"]').focus(); return; }

  if (!recoveryReady) {
    setMessage('This reset link is invalid or has expired. Request a new one from the login page.', 'error');
    return;
  }

  setBusy(btn, true, 'Updating password…');
  try {
    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) throw error;
    setMessage('Password updated. Redirecting you to log in…', 'success');
    await supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1800);
  } catch (err) {
    setMessage(friendlyError(err), 'error');
    setBusy(btn, false, 'Update Password');
  }
});
</script>
</body>
</html>
