<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Hansen Capital Management</title>
<link rel="icon" type="image/png" href="bitlogo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
font-family: 'Helvetica Neue', Arial, sans-serif;
background-color: #030D1D;
color: #D4AF37;
line-height: 1.8;
text-align: center;
}
a { color: #D4AF37; }
header {
background: #071428;
padding: 1.2rem 3rem;
display: flex;
justify-content: space-between;
align-items: center;
}
header img { height: 70px; }
nav a { margin-left: 2rem; font-weight: 500; }

.wrap {
min-height: 75vh;
display: flex;
align-items: center;
justify-content: center;
padding: 40px 20px;
}
.box {
background: #071428;
border: 1px solid rgba(212, 175, 55, 0.4);
padding: 44px;
width: 100%;
max-width: 400px;
text-align: left;
}
.box h1 {
font-family: 'Playfair Display', serif;
font-size: 1.7rem;
font-weight: 500;
text-align: center;
margin-top: 0;
}
.box p.hint {
color: #E8E0C5;
font-size: 0.9rem;
text-align: center;
margin-top: -8px;
}
label {
display: block;
color: #E8E0C5;
font-size: 0.9rem;
margin: 14px 0 6px 0;
}
input {
width: 100%;
box-sizing: border-box;
background: #030D1D;
border: 1px solid rgba(212, 175, 55, 0.35);
color: #E8E0C5;
padding: 10px 12px;
font-size: 1rem;
font-family: 'Helvetica Neue', Arial, sans-serif;
}
input:focus { outline: 1px solid #D4AF37; }
.btn {
width: 100%;
margin-top: 22px;
background: #D4AF37;
color: #030D1D;
font-weight: 600;
padding: 12px;
border: none;
font-size: 1rem;
cursor: pointer;
}
.btn:hover { background: #E8C458; }
.btn:disabled { opacity: 0.6; cursor: default; }
#message {
margin-top: 14px;
font-size: 0.9rem;
min-height: 1.2em;
}
#message.error { color: #E77; }
#message.success { color: #8FCB8F; }
footer {
text-align: center;
padding: 20px 15px;
background: #071428;
font-size: 0.6rem;
color: #D4AF37;
}
</style>
</head>
<body>

<header>
<img src="logo.png" alt="Hansen Capital Management Logo">
<nav>
<a href="index.html">Home</a>
<a href="accounting.html">Accounting</a>
</nav>
</header>

<div class="wrap">
<div class="box">
<h1>Set a New Password</h1>
<p class="hint" id="hint">Enter a new password for your account below.</p>

<form id="reset-form">
<label for="password">New Password</label>
<input type="password" id="password" required minlength="8" autocomplete="new-password">

<label for="confirm">Confirm New Password</label>
<input type="password" id="confirm" required minlength="8" autocomplete="new-password">

<button type="submit" class="btn" id="submit-btn">Update Password</button>
<div id="message"></div>
</form>
</div>
</div>

<footer>
<p>&copy; 2026 Hansen Capital Management LLC. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function setMessage(text, cls) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = cls || '';
}

// Supabase's recovery link logs the user into a temporary "recovery"
// session automatically when they land here (it reads the token from
// the URL fragment for us). We just need to confirm that happened
// before letting them submit a new password.
let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    recoveryReady = true;
  }
});

// Fallback check in case the event already fired before this listener attached
supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) recoveryReady = true;
});

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const btn = document.getElementById('submit-btn');

  if (password !== confirm) {
    setMessage('Passwords do not match.', 'error');
    return;
  }
  if (password.length < 8) {
    setMessage('Password must be at least 8 characters.', 'error');
    return;
  }
  if (!recoveryReady) {
    setMessage('This reset link is invalid or has expired. Request a new one from the login page.', 'error');
    return;
  }

  btn.disabled = true;
  setMessage('Updating…', '');

  try {
    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) throw error;
    setMessage('Password updated. Redirecting to login…', 'success');
    await supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1800);
  } catch (err) {
    setMessage(err.message || 'Something went wrong.', 'error');
    btn.disabled = false;
  }
});
</script>

</body>
</html>
